<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Robot · Circular Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 좌표계 : 피그마 1080 단위를 그대로 CSS px 로 쓰고 마지막에 통째로 scale()
   병원 로봇(dab2n/baton)과 같은 디자인 시스템. 스크린/베젤/하우징/배경 레이어는 동일하고
   장면(문구)만 헬스장 시나리오로 갈아끼운다.

   그래픽 상태는 4가지뿐 : idle → fill → search → full
     idle   중앙의 작은 구슬 (얼굴 대기)
     fill   구슬이 화면을 채움 (엄지척 대기)
     search 구슬은 물러나고 베젤 안쪽이 일렁인다 (링 컨텍스트 수신)
     full   화면을 채운 그라디언트 위에 문구
   장면 목록은 아래 SCENES 배열 하나로만 관리한다.
*/

:root{ --fit: 1238; }          /* 미리보기 : 하우징 자리를 늘 비워둔다 */
body.kiosk{ --fit: 1080; }     /* #screen : 실기기 */

*{ box-sizing: border-box; }
html,body{ height:100%; margin:0; overflow:hidden; background:#fff; }
body{
  display:flex; align-items:center; justify-content:center;
  font-family:'Delight','Pretendard','Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;
}

.device{ position:relative; width:1080px; height:1080px; flex:none; transform:scale(var(--s,1)); }

/* ---------- 제품 하우징 ---------- */
.ring{
  position:absolute; inset:-78.8px; border-radius:50%;
  background:#f3e682;
  box-shadow:0 24px 70px rgba(0,0,0,.16);
}
.ring::before{
  content:''; position:absolute; inset:23.2px; border-radius:50%;
  background:radial-gradient(circle closest-side,#cdc47e 90.4%,#fff8c1 100%);
}
body.bare .ring{ display:none; }

/* ---------- 목업 토글 ---------- */
.toggle{
  position:fixed; right:16px; top:50%; translate:0 -50%; z-index:10;
  display:flex; align-items:center; gap:9px;
  padding:9px 14px 9px 10px; border:1px solid rgba(0,0,0,.14); border-radius:999px;
  background:#fff; color:#000; cursor:pointer;
  font:inherit; font-size:12px; font-weight:500; line-height:1;
  box-shadow:0 2px 12px rgba(0,0,0,.14);
}
.toggle:hover{ background:#f2f2f2; }
.toggle .sw{ width:34px; height:20px; border-radius:999px; flex:none;
             background:#000; transition:background-color .2s; }
.toggle .sw::after{ content:''; display:block; width:16px; height:16px; margin:2px;
                    border-radius:50%; background:#fff;
                    transform:translateX(14px); transition:transform .2s; }
body.bare .toggle .sw{ background:#d6d6d6; }
body.bare .toggle .sw::after{ transform:none; }
body.kiosk .toggle{ display:none; }

/* 카메라 모니터 (테스트용) */
.cam{ position:fixed; right:16px; bottom:16px; z-index:10; width:240px; }
.camview{ display:grid; aspect-ratio:4/3; border-radius:10px; overflow:hidden;
          background:#111; box-shadow:0 2px 12px rgba(0,0,0,.18); }
.camview > *{ grid-area:1/1; width:100%; height:100%; transform:scaleX(-1); }
.camview video{ object-fit:cover; }
.camstat{ margin-top:6px; font-size:11px; line-height:1.5; color:#888;
          text-align:right; white-space:pre-line; }
body.kiosk .cam{ display:none; }

/* ---------- 스크린 1080x1080 ---------- */
.screen{ position:absolute; inset:0; border-radius:50%;
         background:#000; overflow:hidden; }
.bezel{ position:absolute; inset:0; width:1080px; height:1080px;
        z-index:4; pointer-events:none; }

/* ---------- 배경 레이어 ---------- */
.blur39{ position:absolute; inset:0; filter:blur(39px); transition:filter .8s ease; }
.field{ position:absolute; left:28px; top:-132px; width:1022px; height:1053px;
        border-radius:50%; background:linear-gradient(180deg,#fff 23.89%,#f6e280 100%); }
.sheen{ position:absolute; left:413px; top:-72px; width:424px; height:420px;
        border-radius:50%; background:#def2ff; opacity:.82; filter:blur(100px); }
.core { position:absolute; left:330px; top:454px; width:332px; height:328px;
        border-radius:50%; background:#fdffde; filter:blur(100px); }
.cyan { position:absolute; left:31px; top:-186px; width:1116px; height:828px;
        opacity:.27; filter:blur(100px); }

.field,.sheen,.core,.cyan{
  transform-origin:50% 50%;
  transition:transform 1.8s cubic-bezier(.45,0,.15,1), opacity 1.2s ease,
             translate 1.2s ease, scale 1.2s ease, rotate 1.2s ease,
             border-radius 1.2s ease;
}

body.idle   .field{ transform:translate(1px,145.5px) scale(.22); }
body.fill   .field{ transform:translate(1px,145.5px) scale(1.2); }
body.search .field{ transform:translate(1px,145.5px) scale(.58); }
body.full   .field{ transform:translate(1px,145.5px) scale(1.2); }

body.idle .sheen{ opacity:0; }
body.idle .core, body.fill .core{ transform:scale(.4); opacity:0; }
body.search .core{ transform:translate(9px,-29px); }
body.idle .cyan, body.fill .cyan, body.search .cyan{
  transform:translate(9px,172.5px) scale(.469); opacity:.09;
}

/* 살아있는 구슬 : idle 에서만 배회하고, 채워진 뒤에는 고정 */
body.idle .field{
  animation:wander 30s linear      infinite,
            ripple  6s ease-in-out infinite,
            sway    7s ease-in-out infinite alternate;
}
/* 발광 링 : 구슬 바깥 테두리만 밝게. 안쪽 그라디언트는 원래대로 둔다 */
.field::before{
  content:''; position:absolute; inset:-9%; border-radius:inherit;
  opacity:0; transition:opacity .8s ease;
  background:conic-gradient(from 0deg,
    rgba(255,250,214,1) 0deg, rgba(255,246,196,.3) 100deg,
    rgba(255,246,196,.1) 190deg, rgba(255,248,204,.45) 280deg, rgba(255,250,214,1) 360deg);
  -webkit-mask:radial-gradient(circle closest-side, transparent 68%, #000 88%, #000 100%);
          mask:radial-gradient(circle closest-side, transparent 68%, #000 88%, #000 100%);
}
body.idle .field::before{ opacity:1; animation:gleam 9s ease-in-out infinite; }
@keyframes gleam{
   0%  { rotate:  0deg; opacity:.5;  }
  22%  { rotate:132deg; opacity:1;   }
  38%  { rotate: 98deg; opacity:.62; }
  62%  { rotate:254deg; opacity:1;   }
  80%  { rotate:222deg; opacity:.55; }
 100%  { rotate:360deg; opacity:.5;  }
}
body.idle .blur39{ filter:blur(17px); }
/* 정적 장면에서 .field 를 움직이면 검정이 드러난다. 고정하고 위의 블롭만 흘린다 */
body:not(.idle) .field{ animation:none; translate:0 0; scale:1; rotate:0deg; border-radius:50%; }
.sheen{ animation:drift2  9s ease-in-out infinite alternate; }
.core { animation:drift4 11s ease-in-out infinite alternate; }
.cyan { animation:drift3 13s ease-in-out infinite alternate; }
@keyframes wander{
   0%  { translate:  0px   0px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
   7%  { translate:-46px -30px; scale:1.09 .93;  animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  25%  { translate:-38px -22px; scale:1.01 1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  32%  { translate: 30px -54px; scale:.92  1.11; animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  48%  { translate: 24px -44px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  54%  { translate: 56px  18px; scale:1.08 .94;  animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  70%  { translate: 48px  14px; scale:1    1.01; animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  77%  { translate:-28px  48px; scale:.94  1.08; animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  93%  { translate:-22px  40px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
 100%  { translate:  0px   0px; scale:1    1;    }
}
@keyframes sway{ from{ rotate:-30deg; } to{ rotate:30deg; } }
@keyframes ripple{
   0%,100%{ border-radius:50% 50% 50% 50% / 50% 50% 50% 50%; }
  20%     { border-radius:63% 37% 44% 56% / 41% 59% 41% 59%; }
  40%     { border-radius:39% 61% 59% 41% / 59% 37% 63% 41%; }
  60%     { border-radius:57% 43% 37% 63% / 44% 63% 37% 56%; }
  80%     { border-radius:42% 58% 62% 38% / 61% 42% 58% 39%; }
}
@keyframes drift2{ to{ translate:-252px 344px; scale:1.72; } }
@keyframes drift3{ to{ translate:206px 322px; rotate:18deg; scale:1.28; } }
@keyframes drift4{ to{ translate:-134px 168px; scale:1.62; } }

/* ---------- search : 베젤 바로 안쪽이 숨쉬듯 일렁인다 ---------- */
.rim{
  position:absolute; inset:0; border-radius:50%; z-index:1; pointer-events:none;
  opacity:0; transition:opacity 1s ease;
  box-shadow:inset 0 0 52px 8px rgba(255,250,214,.6);
}
/* full 로 넘어가도 애니메이션은 계속 돌린다 (끊긴 느낌 방지). 사라지는 건 opacity 만 */
body.search .rim,
body.full   .rim{ animation:breathe 3.4s ease-in-out infinite; }
body.search .rim{ opacity:1; }
@keyframes breathe{
  0%,100%{ box-shadow:inset 0 0 44px  4px rgba(255,250,214,.45); }
  50%    { box-shadow:inset 0 0 104px 30px rgba(255,250,214,.92); }
}
.rim::after{
  content:''; position:absolute; inset:0; border-radius:inherit; opacity:0;
  background:radial-gradient(circle at 50% 3%, rgba(255,255,255,.9), transparent 44%);
  filter:blur(44px); transition:opacity 1s ease;
}
body.search .rim::after,
body.full   .rim::after{ animation:orbit 11s linear infinite; }
body.search .rim::after{ opacity:1; }
@keyframes orbit{ to{ rotate:360deg; } }

/* ---------- 기기 칩 : 스크린 상단에서 아래로 ---------- */
.pill{
  position:absolute; left:50%; top:150px; transform:translateX(-50%); z-index:3;
  display:grid; place-items:center; padding:12px 30px;
  border-radius:999px; overflow:hidden;
  opacity:0; translate:0 -30px;
  transition:opacity .5s ease, translate .8s cubic-bezier(.3,.9,.3,1);
}
body.chip .pill{ opacity:1; translate:0 0; transition-delay:.35s; }
.pbg{ position:absolute; inset:0; border-radius:inherit;
      background:rgba(255,248,190,.2); mix-blend-mode:color-burn; }
.pill::after{ content:''; position:absolute; inset:0; border-radius:inherit;
              box-shadow:inset 0 0 10px 0 #fff; pointer-events:none; }
.pc{ grid-area:1/1; display:flex; align-items:center; justify-content:center; gap:12px;
     opacity:0; white-space:nowrap; transition:opacity .4s ease; }
body.chip .pc{ opacity:1; transition-delay:.6s; }
.pc b{ font-weight:500; font-size:20px; line-height:1.5; color:#2e2e0c; display:block; }
.pc s{ font-weight:500; font-size:14px; line-height:1.5; color:rgba(46,46,12,.62);
       display:block; text-decoration:none; }
.dumbbell{ width:52px; height:34px; flex:none; }

/* ---------- 본문 : 한 장면 = 카운터 + 문장 + 부가정보 ---------- */
/* flex 로 세로 중앙 정렬 — 줄 수·구성이 달라도 항상 스크린 정중앙 */
.stage{
  /* z-index 를 주면 스택 컨텍스트가 생겨 color-burn 이 배경까지 못 닿는다.
     .rim(z1) 보다 뒤 DOM 이라 auto 로도 위에 온다 */
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:22px; padding:0 150px; pointer-events:none;
}
.stage > *{ margin:0; text-align:center; mix-blend-mode:color-burn; color:#3e3d0a; }
body.solid .stage > *{ mix-blend-mode:normal; }   /* 엄지척 이전 : 투명감 없이 단색 */

.count{ font-size:196px; font-weight:600; line-height:1; letter-spacing:-.02em;
        font-variant-numeric:tabular-nums; }
.count u{ text-decoration:none; font-weight:500; opacity:.42; }   /* "/ 10" 쪽 */
.headline{ font-size:42px; font-weight:500; line-height:1.6; }
.meta    { font-size:30px; font-weight:400; line-height:1.55; }
.stage em{ font-style:normal; font-weight:600; }

.w{ display:inline-block; opacity:0; will-change:transform,opacity,filter;
    animation:in .9s cubic-bezier(.2,.7,.2,1) both; }
@keyframes in{
  from{ opacity:0; transform:translateY(.42em); filter:blur(10px); }
  to  { opacity:1; transform:none;              filter:blur(0);    }
}

@media (prefers-reduced-motion:reduce){
  .w{ animation:none; opacity:1; }
  .field,.sheen,.core,.cyan,.rim,.rim::after{ animation:none; }
}
</style>
</head>
<body class="idle">

<button class="toggle" type="button" aria-pressed="true">
  <span class="sw"></span><span class="lb">제품 목업</span>
</button>

<div class="cam">
  <div class="camview">
    <video id="camv" playsinline muted></video>
    <canvas id="camc" width="320" height="240"></canvas>
  </div>
  <div class="camstat">카메라 준비 중…</div>
</div>

<div class="device">
  <div class="ring"></div>

  <div class="screen">
    <div class="blur39"><div class="field"></div></div>
    <div class="sheen"></div>
    <div class="core"></div>
    <svg class="cyan" viewBox="0 0 1116 828" aria-hidden="true">
      <path fill="#8AFFF3" d="M916 401.141C916 493.216 717.924 628 569.426 628C420.927 628 200 353.907 200 261.832C200 169.756 393.505 207.78 542.004 207.78C690.503 207.78 916 309.065 916 401.141Z"/>
    </svg>
    <div class="rim"></div>

    <div class="stage"></div>

    <div class="pill">
      <span class="pbg"></span>
      <div class="pc">
        <svg class="dumbbell" viewBox="0 0 52 34" aria-hidden="true">
          <defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffff80"/><stop offset="1" stop-color="#ffc943"/>
          </linearGradient></defs>
          <g fill="url(#dg)">
            <rect x="0"  y="7"  width="7" height="20" rx="3"/>
            <rect x="8"  y="2"  width="8" height="30" rx="3.5"/>
            <rect x="16" y="14" width="20" height="6" rx="3"/>
            <rect x="36" y="2"  width="8" height="30" rx="3.5"/>
            <rect x="45" y="7"  width="7" height="20" rx="3"/>
          </g>
        </svg>
        <div><b>K Fitness</b><s>Pull Station · 02</s></div>
      </div>
    </div>
  </div>

  <!-- 베젤 : 피그마 176:581 (바깥 원 1080 - 실디스플레이 1030.43x1022.68) -->
  <svg class="bezel" viewBox="0 0 1080 1080" aria-hidden="true">
    <mask id="aa" maskUnits="userSpaceOnUse" x="0" y="0" width="1080" height="1080">
      <rect width="1080" height="1080" fill="#fff"/>
      <path transform="translate(24.63 32.36)" d="M425.668 0.282314C364.691 11.0315 306.254 32.7253 253.095 64.1911C195.831 98.0022 145.798 142.562 105.538 195.331C65.2771 248.1 35.5702 308.295 18.1761 372.4C9.96763 402.888 4.49532 434.159 1.75916 465.624C0.586523 480.869 0.00020106 495.918 0.00020106 511.162C0.00020106 518.589 0.195639 526.015 0.586519 533.442C0.977398 540.673 1.56372 548.1 2.15004 555.331C8.01323 616.895 24.821 676.895 51.7917 732.595C80.9123 792.4 121.173 845.755 170.424 890.315C219.87 934.875 277.329 969.273 339.87 991.944C369.577 1002.69 400.261 1010.71 431.531 1015.79C446.58 1018.33 461.629 1020.09 476.873 1021.26C491.531 1022.43 506.385 1022.82 521.238 1022.63C583.192 1021.85 644.365 1009.92 702.215 987.449C763.974 963.409 820.652 927.449 868.925 881.911C917.199 836.178 956.287 781.65 984.039 721.064C997.134 692.334 1007.69 662.432 1015.31 631.748C1019.02 616.895 1021.95 602.041 1024.3 586.992C1026.65 572.334 1028.21 557.677 1029.19 543.019C1033.49 481.26 1026.65 419.11 1008.86 359.696C989.903 296.178 958.828 236.764 917.394 185.168C875.961 133.377 824.951 90.1846 767.297 57.937C739.935 42.4973 711.01 29.7937 681.303 19.6308C667.036 14.7448 652.378 10.4452 637.72 6.92725C630.489 5.1683 623.258 3.60478 616.026 2.04126C612.508 1.2595 608.795 0.673181 605.277 0.0868621C604.105 0.0868621 603.323 -0.108578 602.15 0.0868621C600.977 0.0868621 600 0.47776 599.023 0.868639C597.069 1.6504 595.31 3.01848 594.137 4.77743C575.961 30.1846 546.645 45.038 515.375 45.038C484.105 45.038 454.984 29.9892 436.613 4.77743C434.072 1.25952 429.968 -0.499445 425.668 0.282314Z"/>

<script>
if (location.hash === '#screen') document.body.classList.add('bare','kiosk');

// scale() 은 단위 없는 수만 받으므로 JS로 계산
const FILL = .92;
const fit = () => document.documentElement.style.setProperty('--s',
  Math.min(innerWidth, innerHeight) * (document.body.classList.contains('kiosk') ? 1 : FILL) /
  parseFloat(getComputedStyle(document.body).getPropertyValue('--fit')));
addEventListener('resize', fit);
fit();

/* ---------- 장면 목록 (피그마 2436:392 · STAGE 01~05) ----------
   look  : idle | fill | search | full
   hold  : 다음 장면까지 머무는 ms. 0 이면 카메라/탭 입력을 기다린다
   chip  : 상단 기기 칩 노출
   solid : 엄지척 이전 — 텍스트를 투명감 없이 단색으로
   delay : 첫 단어가 올라오기까지의 대기(ms). 그래픽이 자리잡은 뒤에 글이 오게
   hold1 : 한 호흡으로 읽히는 짧은 문장 — 문장부호에서 쉬지 않는다             */
const SCENES = [
  { look:'idle',   hold:0 },                                                   // 얼굴 대기
  { look:'fill',   hold:0, solid:true, delay:1750,                             // 01a 엄지척 대기
    text:'Hello, shall we start your workout?' },
  { look:'search', hold:4200 },                                                // 01a Receiving…
  { look:'full',   hold:4300, chip:true, delay:1500, hold1:true,               // 01b
    text:'Welcome back, <em>Somi.</em>' },
  { look:'full',   hold:6000, chip:true,                                       // 01c
    text:'Today&rsquo;s context', meta:'Shoulder · Mild discomfort<br>Upper-body workout' },
  { look:'full',   hold:4600, chip:true, hold1:true,                           // 02a
    text:'Analyzing your workout context…' },
  { look:'full',   hold:6400, chip:true,                                       // 02b
    text:'Workout setting adjusted.<br><em>Shoulder-friendly mode</em> recommended.',
    meta:'Level 03 · Resistance Light' },
  { look:'full',   hold:6000, chip:true,                                       // 02c
    text:'Adjusting resistance.<br>Setting the handle for you.', meta:'Level 03 &rarr; <em>Level 02</em>' },
  { look:'full',   hold:6000, chip:true,                                       // 02d
    text:'You&rsquo;re all set.<br>Your workout has been adjusted to your condition.' },
  { look:'full',   hold:5200, chip:true,                                       // 03a
    text:'Ready? Let&rsquo;s begin your workout.', meta:'<em>10</em> REPS' },
  { look:'full',   hold:4200, chip:true, count:'3<u>/10</u>', text:'Pull. Keep going.' },              // 03b
  { look:'full',   hold:4600, chip:true, count:'4<u>/10</u>', text:'Pull slowly. Good pace.' },        // 03c
  { look:'full',   hold:5200, chip:true, count:'5<u>/10</u>',                                          // 03d
    text:'Resistance adjusted.', meta:'Adjusted for your current movement · <em>Level 02</em>' },
  { look:'full',   hold:5600, chip:true, count:'10<u>/10</u>',                                         // 03e
    text:'Set complete. Great work.', meta:'Take a short rest.' },
  { look:'full',   hold:5200, chip:true,                                                               // 05a
    text:'Workout complete.', meta:'<em>30</em> REPS · <em>3</em> SETS' },
  { look:'full',   hold:6400, chip:true,                                                               // 05b
    text:'Today&rsquo;s workout', meta:'Upper body<br>Resistance · Level 03<br>30 reps · 3 sets' },
  { look:'full',   hold:6800, chip:true,                                                               // 05c
    text:'Workout context saved.<br>Your settings have been recorded for your next session.' },
  { look:'full',   hold:0, chip:true, hold1:true,                                                      // 05d
    text:'Goodbye, <em>Somi.</em> See you next time.' },
];

const PAUSE = 7;   // 문장 경계에서 건너뛸 칸 수 (1칸 = 스태거 1단위)
const stage = document.querySelector('.stage');

// 텍스트를 단어 단위로 쪼개고 DOM 순서대로 딜레이 부여
const split = (el, base, hold1, start) => {
  let i = start;
  const walk = node => {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        for (const part of child.data.split(/(\s+)/)) {
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.append(part); continue; }
          const s = document.createElement('span');
          s.className = 'w'; s.style.animationDelay = (i * 70 + base) + 'ms';
          s.textContent = part;
          // 문장이 끊기는 자리에서 한 박자 쉰다
          i += !hold1 && /[,.?!…]$/.test(part) ? PAUSE : 1;
          frag.append(s);
        }
        child.replaceWith(frag);
      } else if (child.tagName !== 'BR') { walk(child); }
    }
  };
  walk(el);
  return i;
};

const draw = s => {
  stage.replaceChildren();
  const base = s.delay ?? 200;
  let i = 0;
  for (const [cls, html] of [['count', s.count], ['headline', s.text], ['meta', s.meta]]) {
    if (!html) continue;
    const el = document.createElement(cls === 'count' ? 'div' : 'p');
    el.className = cls; el.innerHTML = html;
    stage.append(el);
    // 카운터는 한 덩어리로 먼저, 문장은 그다음 박자부터
    i = split(el, base, s.hold1 || cls === 'count', i) + (cls === 'count' ? 1 : 0);
  }
};

const body = document.body;
let idx = 0, timer;

const go = n => {
  clearTimeout(timer);
  idx = n;
  const s = SCENES[n];
  body.className = [
    body.classList.contains('bare')  ? 'bare'  : '',
    body.classList.contains('kiosk') ? 'kiosk' : '',
    s.look, s.chip ? 'chip' : '', s.solid ? 'solid' : '',
  ].filter(Boolean).join(' ');
  draw(s);
  if (s.hold) timer = setTimeout(() => go(n + 1), s.hold);
};
// 카메라가 없을 때의 수동 진행 : 한 단계씩, 마지막에서 리셋
const tap = () => go(idx >= SCENES.length - 1 ? 0 : idx + 1);
window.__go = go; window.__step = () => idx;

const toggle = document.querySelector('.toggle');
toggle.addEventListener('pointerdown', e => e.stopPropagation());
toggle.addEventListener('click', () => {
  const off = body.classList.toggle('bare');
  toggle.setAttribute('aria-pressed', String(!off));
  fit();
});

addEventListener('pointerdown', tap);
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') tap(); });

go(0);
</script>

<script type="module">
/* ---------- 카메라 인터랙션 (병원 로봇과 동일 스펙) ----------
   장면 0 : 얼굴이 가까워지면(≈30cm 이내) 원이 커진다
   장면 1 : 엄지척을 올리면 다음 단계로 넘어간다
   카메라/권한이 없으면 조용히 꺼지고 탭 조작만 남는다. */

// ponytail: 웹캠 화각마다 다르므로 실기기에서 이 값들만 보정한다.
const NEAR = .34;   // 얼굴 폭 ÷ 프레임 폭. 화각 65° 기준 0.34 ≈ 30cm, 0.5 ≈ 20cm
const HITS = 3;     // 트리거까지 필요한 누적 프레임
const GMIN = .35;   // 엄지척으로 인정할 최소 점수

const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18';
const M = 'https://storage.googleapis.com/mediapipe-models';
const stat  = document.querySelector('.camstat');
const video = document.getElementById('camv');
const cv    = document.getElementById('camc');
const cx    = cv.getContext('2d');
const say   = t => { stat.textContent = t; };

let fd, gr, hits = 0, last = -1;

const loop = () => {
  requestAnimationFrame(loop);
  const t = performance.now();
  if (t - last < 100) return;          // 10fps 면 충분
  last = t;
  if (!video.videoWidth) return;

  const face = fd.detectForVideo(video, t).detections[0];
  const hand = gr.recognizeForVideo(video, t);
  const ratio = face ? face.boundingBox.width / video.videoWidth : 0;
  const g = (hand.gestures ?? []).map(c => c[0]).filter(Boolean)
              .sort((x, y) => y.score - x.score)[0];
  const up = (hand.gestures ?? []).some(c => c.some(k => k.categoryName === 'Thumb_Up' && k.score >= GMIN));

  const sx = cv.width / video.videoWidth, sy = cv.height / video.videoHeight;
  cx.clearRect(0, 0, cv.width, cv.height);
  if (face) {
    const b = face.boundingBox;
    cx.strokeStyle = ratio >= NEAR ? '#3ddc84' : '#ffcc00';
    cx.lineWidth = 3;
    cx.strokeRect(b.originX * sx, b.originY * sy, b.width * sx, b.height * sy);
  }
  for (const marks of hand.landmarks ?? []) {
    cx.fillStyle = up ? '#3ddc84' : '#4aa8ff';
    for (const p of marks) {
      cx.beginPath(); cx.arc(p.x * cv.width, p.y * cv.height, 3, 0, 6.284); cx.fill();
    }
  }

  const n = window.__step();
  say('얼굴 ' + (ratio ? Math.round(ratio * 100) + '%' : '—') + ' / ' + Math.round(NEAR * 100) + '%\n'
    + '제스처 ' + (g ? g.categoryName + ' ' + g.score.toFixed(2) : '—') + '\n'
    + (n === 0 ? '얼굴을 가까이' : n === 1 ? '엄지척을 올리세요' : '진행 중'));

  // 트리거 : 놓친 프레임 하나에 초기화되지 않게 깎기만 한다
  const wants = n === 0 ? ratio >= NEAR : n === 1 ? up : false;
  hits = wants ? hits + 1 : Math.max(0, hits - 1);
  if (wants && hits >= HITS) { hits = 0; window.__go(n + 1); }
};

try {
  const { FilesetResolver, FaceDetector, GestureRecognizer } = await import(V + '/vision_bundle.mjs');
  const vision = await FilesetResolver.forVisionTasks(V + '/wasm');
  [fd, gr] = await Promise.all([
    FaceDetector.createFromOptions(vision, { runningMode: 'VIDEO',
      baseOptions: { modelAssetPath: M + '/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' } }),
    GestureRecognizer.createFromOptions(vision, { runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: .4, minHandPresenceConfidence: .4, minTrackingConfidence: .4,
      cannedGesturesClassifierOptions: { scoreThreshold: .2 },
      baseOptions: { modelAssetPath: M + '/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task' } }),
  ]);
  say('카메라 권한을 허용해 주세요');
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
  await video.play();
  say('카메라 ON');
  requestAnimationFrame(loop);
} catch (e) {
  say('카메라 없음 — 화면을 탭해 진행');
  console.warn('[cam]', e);
}
</script>
</body>
