<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gym Robot · Circular Screen</title>
<style>
/* 좌표계 : 피그마 1080 단위를 그대로 CSS px 로 쓰고 마지막에 통째로 scale()
   병원 로봇(dab2n/baton)과 같은 디자인 시스템. 스크린/베젤/하우징/배경 레이어는 동일하고
   장면(문구)만 헬스장 시나리오로 갈아끼운다.

   그래픽 상태는 4가지뿐 : idle → fill → search → full
     idle   중앙의 작은 구슬 (얼굴 대기)
     fill   구슬이 화면을 채움 (엄지척 대기)
     search 구슬은 물러나고 베젤 안쪽이 일렁인다 (링 컨텍스트 수신)
     full   화면을 채운 그라디언트 위에 문구
   장면 목록은 아래 SCENES 배열 하나로만 관리한다.
*/

:root{ --fit: 1238; }          /* 미리보기 : 하우징 자리를 늘 비워둔다 */
body.kiosk{ --fit: 1080; }     /* #screen : 실기기 */

*{ box-sizing: border-box; }
/* 스크린 밖 여백 : 채도 낮은 검정에 가까운 남색 (병원 로봇과 동일) */
html,body{ height:100%; margin:0; overflow:hidden; background:#0B0F18; }
html:has(.shot), html:has(.shot) body{ background:transparent; }   /* ?s=N : 배경색 없이 UI 만 */
body{
  display:flex; align-items:center; justify-content:center;
  font-family:var(--ff-en,'Magnetik'), var(--ff-ko,'SF Pro KR'), 'Pretendard Web', system-ui, sans-serif;
  -webkit-font-smoothing:antialiased;
  cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;
}
/* 자간 : Magnetik 은 -2% (letter-spacing 은 계산된 px 로 상속돼서 요소마다 em 을 다시 풀어준다) */
.device, .device *{ letter-spacing:-0.02em; }

/* 영문 : 피그마의 Helvetica Now Display · SF Pro +KR Display (유료라 저장소엔 없다 — 설치된 글꼴을 local 로만) */
@font-face{ font-family:'Helvetica Now Bold'; font-weight:700; src:local('HelveticaNowDisplay-Bold'), local('Helvetica Now Display Bold'); }
@font-face{ font-family:'Helvetica Now Med'; font-weight:500; src:local('HelveticaNowDisplay-Medium'), local('Helvetica Now Display Medium'); }
@font-face{ font-family:'SF Pro KR'; font-weight:500; src:local('SFProKRDisplay-Medium'), local('SFProKR-Medium'); }
/* 한글 : 병원 로봇과 같은 SF Pro KR (한글 구간만) */
@font-face{ font-family:'SF Pro KR'; font-weight:600; font-display:block;
  src:url('fonts/SFProKR-Semibold.otf') format('opentype');
  unicode-range:U+1100-11FF, U+3130-318F, U+AC00-D7A3; }
@font-face{ font-family:'SF Pro KR'; font-weight:700; font-display:block;
  src:url('fonts/SFProKR-Bold.otf') format('opentype');
  unicode-range:U+1100-11FF, U+3130-318F, U+AC00-D7A3; }
/* 폰트 대체 : Magnetik 가 없는 컴퓨터(배포 링크)에선 Pretendard 로. 자간은 굵기·크기별 실측 보정 */
@font-face{ font-family:'Pretendard Web'; font-weight:400; font-display:swap;
  src:local('Pretendard Regular'), local('Pretendard-Regular'), url('pretendard/Pretendard-Regular.subset.woff2') format('woff2'); }
@font-face{ font-family:'Pretendard Web'; font-weight:500; font-display:swap;
  src:local('Pretendard Medium'), local('Pretendard-Medium'), url('pretendard/Pretendard-Medium.subset.woff2') format('woff2'); }
@font-face{ font-family:'Pretendard Web'; font-weight:600; font-display:swap;
  src:local('Pretendard SemiBold'), local('Pretendard-SemiBold'), url('pretendard/Pretendard-SemiBold.subset.woff2') format('woff2'); }
@font-face{ font-family:'Pretendard Web'; font-weight:700; font-display:swap;
  src:local('Pretendard Bold'), local('Pretendard-Bold'), url('pretendard/Pretendard-Bold.subset.woff2') format('woff2'); }
html.fb-en{ --ff-en:'Pretendard Web'; }

.device{ position:relative; width:1080px; height:1080px; flex:none; transform:scale(var(--s,1)); }

/* ---------- 제품 하우징 ---------- */
.ring{
  position:absolute; inset:-78.8px; border-radius:50%;
  background:#f3e682;
  box-shadow:0 24px 70px rgba(0,0,0,.16);
}
.ring::before{
  content:''; position:absolute; inset:23.2px; border-radius:50%;
  background:radial-gradient(circle closest-side,#cdc47e 90.4%,#fff8c1 100%);
}
body.bare .ring{ display:none; }

/* ---------- 목업 토글 ---------- */
.toggle{
  position:fixed; right:16px; top:50%; translate:0 -50%; z-index:10;
  display:flex; align-items:center; gap:9px;
  padding:9px 14px 9px 10px; border:1px solid rgba(0,0,0,.14); border-radius:999px;
  background:#fff; color:#000; cursor:pointer;
  font:inherit; font-size:12px; font-weight:500; line-height:1;
  box-shadow:0 2px 12px rgba(0,0,0,.14);
}
.toggle:hover{ background:#f2f2f2; }
.toggle .sw{ width:34px; height:20px; border-radius:999px; flex:none;
             background:#000; transition:background-color .2s; }
.toggle .sw::after{ content:''; display:block; width:16px; height:16px; margin:2px;
                    border-radius:50%; background:#fff;
                    transform:translateX(14px); transition:transform .2s; }
body.bare .toggle:not(.camt) .sw{ background:#d6d6d6; }
body.bare .toggle:not(.camt) .sw::after{ transform:none; }
/* 카메라 영역 토글 : 목업 토글 아래에. 끄면 썸네일만 감추고 인식은 계속한다 */
.toggle.camt{ translate:0 calc(-50% + 46px); }
body.nocam .toggle.camt .sw{ background:#d6d6d6; }
body.nocam .toggle.camt .sw::after{ transform:none; }
body.nocam .cam{ opacity:0; pointer-events:none; }
body.nocam .bezel{ display:none; }   /* 스크린 위에 그려 둔 카메라 자리(반원)도 같이 지운다 */
body.kiosk .toggle{ display:none; }
/* 장면 바로 가기 : 구간별로 골라 그 자리부터 재생 (디자인 확인용) */
.jump{ position:fixed; left:16px; top:50%; translate:0 -50%; z-index:10; display:flex; flex-direction:column; gap:4px;
  padding:6px; border-radius:22px; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.14); }
.jump button{ font:inherit; font-size:12px; font-weight:500; line-height:1; padding:9px 14px; border:0; border-radius:999px;
  background:transparent; color:#000; cursor:pointer; text-align:left; }
.jump button:hover{ background:#f2f2f2; }
.jump button.on{ background:#000; color:#fff; }
.jump, .jump button{ cursor:pointer; }
body.rec .jump, body.shot .jump{ display:none; }   /* 'device' 는 기기 상자(.device)의 클래스라 body 에 붙이면 안 된다 (1080 상자로 축소됨) */
body.rec .cam, body.rec .toggle{ display:none; }

/* 카메라 모니터 (테스트용) */
.cam{ position:fixed; right:16px; bottom:16px; z-index:10; width:240px; }
.camview{ display:grid; aspect-ratio:4/3; border-radius:10px; overflow:hidden;
          background:#111; box-shadow:0 2px 12px rgba(0,0,0,.18); }
.camview > *{ grid-area:1/1; width:100%; height:100%; transform:scaleX(-1); }
.camview video{ object-fit:cover; }
.camstat{ margin-top:6px; font-size:11px; line-height:1.5; color:#888;
          text-align:right; white-space:pre-line; }
body.kiosk .cam{ display:none; }

/* ---------- 스크린 1080x1080 ---------- */
.screen{
  position:absolute; inset:0; border-radius:50%;
  /* 배경 : 기본은 순검정. 위아래 색(피그마 헬스장 ui)은 카운트다운·카운팅에서만 쓴다
     (스트로크 모션이 도는 문장 화면과는 같이 쓰지 않는다) */
  background:#000; transition:background .9s ease;
  overflow:hidden;
  clip-path:circle(490px at 540px 540px);   /* 피그마 3971:702 : border 50px → 보이는 반지름 490 */
}
/* 위아래 색 띠 (피그마 3124:17775 의 감청 / 밝은 회색) :
   직선 그라디언트는 검은 화면에서 경계가 가로줄로 보인다 → 스크린과 같은 중심(540,540)의 동심원으로 번지게 하고
   위/아래 방향은 아주 긴 마스크로만 나눈다. 등색선이 테두리와 같은 곡률(가운데가 높고 옆이 낮다)로 휜다 */
.screen::before, .screen::after{ content:''; position:absolute; inset:0; pointer-events:none;
  transition:opacity 1.4s ease; }   /* idle → fill 로 넘어갈 때 뚝 켜지지 않고 스며 나온다 */
/* 색은 피그마 그라디언트 바 그대로 (9% #0F1627 → 33% 검정 → 80% 검정 → 98% #3D3D3D).
   세지 않게, 경계가 길게 풀리도록 마스크를 넓혔다 */
.screen::before{   /* 위 : 감청 */
  background:radial-gradient(circle 530px at 540px 540px, rgba(15,22,39,0) 44%, rgba(15,22,39,.3) 70%, rgba(15,22,39,.62) 88%, #0F1627 98%, #0F1627 100%);
  -webkit-mask:linear-gradient(180deg,#000 0 6%, rgba(0,0,0,.9) 20%, rgba(0,0,0,.55) 32%, transparent 58%);
          mask:linear-gradient(180deg,#000 0 6%, rgba(0,0,0,.9) 20%, rgba(0,0,0,.55) 32%, transparent 58%); }
.screen::after{    /* 아래 : 회색 */
  background:radial-gradient(circle 530px at 540px 540px, rgba(61,61,61,0) 52%, rgba(61,61,61,.12) 78%, rgba(61,61,61,.24) 92%, rgba(61,61,61,.62) 99%, rgba(61,61,61,.62) 100%);
  -webkit-mask:linear-gradient(0deg,#000 0 2%, rgba(0,0,0,.5) 12%, rgba(0,0,0,.26) 26%, transparent 46%);
          mask:linear-gradient(0deg,#000 0 2%, rgba(0,0,0,.5) 12%, rgba(0,0,0,.26) 26%, transparent 46%); }
/* 기본 화면(얼굴 인식 전)은 위아래 아무것도 없이 순검정. 띠는 구슬이 커질 때부터 */
body.idle .screen::before, body.idle .screen::after, body.idle .rimlight{ opacity:0; }
/* 그 색이 가장자리를 따라 아주 천천히 돈다 : 원뿔 그라디언트를 테두리 쪽만 남기고 회전 */
.rimlight{ position:absolute; inset:-8%; pointer-events:none;
  background:conic-gradient(from 0deg,
    rgba(30,44,76,0)    0deg, rgba(36,52,90,.5)   55deg, rgba(22,29,48,0)  135deg,
    rgba(62,69,83,0)  205deg, rgba(62,69,83,.4)  275deg, rgba(30,44,76,0)  360deg);
  -webkit-mask:radial-gradient(circle closest-side, transparent 70%, #000 92%);
          mask:radial-gradient(circle closest-side, transparent 70%, #000 92%);
  opacity:.55; transition:opacity 1.4s ease; animation:rimOrbit 18s linear infinite; }
@keyframes rimOrbit{ to{ rotate:360deg; } }
/* 얼굴 근접 : 띠는 캔버스(.bandc)가 12시부터 한 바퀴 그리며 나타난다 (병원과 같다) */
body.fill .screen::before, body.fill .screen::after{ opacity:0; transition:none; }
/* 맥락 전달(별 모션) 동안은 영상만 : 위아래 색과 가장자리 발광을 끈다 (병원 connecting 과 같다) */
body.search .screen::before, body.search .screen::after, body.search .rimlight{ opacity:0; }
@keyframes rimIn{ 0%, 15%{ opacity:0; } 100%{ opacity:.35; } }
body.fill .rimlight{ opacity:.35; animation:rimIn 2s both, rimOrbit 18s linear infinite; }
.bandc{ position:absolute; inset:0; width:1080px; height:1080px; pointer-events:none; opacity:0; }
body.fill .bandc{ opacity:.85; }
.bandc.on{ opacity:.85; }
/* ---------- bye : 세션이 끝나면 인사하고, 띠를 돌려 지우며 대기 상태로 ---------- */
body.bye .field{ transform:translate(1px,145.5px) scale(.17); opacity:0; }
body.bye .blur39{ filter:blur(30px); }
body.bye .screen::before, body.bye .screen::after{ opacity:0; transition:none; }
body.bye .bandc{ opacity:.85; }
body.bye .rimlight{ opacity:.35; }
/* 마지막 화면(카운팅)은 서서히 걷히고, 인사도 다 쓰인 뒤(3.2s) 옅어진 다음 대기 상태로 */
body.bye .nv{ transition-duration:.9s; }
body.bye .headline{ animation:byeOut .6s ease 3.4s both; }   /* 병원과 같은 시각 */
@keyframes byeOut{ to{ opacity:0; } }
body.eraseb .screen::before, body.eraseb .screen::after{ opacity:0; transition:none; }
body.eraseb .rimlight{ opacity:0; transition:opacity 1.2s ease; }
.bezel{ position:absolute; inset:0; width:1080px; height:1080px;
        z-index:4; pointer-events:none; }
/* 두꺼워진 베젤 (피그마 border 50px solid #000) : 스크린 바깥에 덧그린다 */
.bez{ position:absolute; inset:0; border-radius:50%; border:50px solid #000; box-sizing:border-box;
  z-index:2; pointer-events:none; }
body.nocam .bezel, body.nocam .lens, body.nocam .slight{ display:none; }
.lens{ position:absolute; left:50%; top:47px; translate:-50% 0; width:31px; height:31px; border-radius:50%;
  overflow:hidden; opacity:.66; z-index:5; pointer-events:none; }
.lens img{ display:block; width:119.09%; height:120.42%; margin:-10.13% 0 0 -8.9%; }
/* 센싱 라이트 : 렌즈 옆에서 아주 느리게 숨 쉰다 */
.slight{ position:absolute; left:566px; top:58px; width:10px; height:10px; border-radius:50%; z-index:5;
  background:radial-gradient(circle, #DEC1A9 0%, #999999 100%); filter:blur(1px);
  mix-blend-mode:hard-light; pointer-events:none; animation:slBreath 3.4s ease-in-out infinite; }
@keyframes slBreath{ 0%,100%{ opacity:.88; scale:.96; } 50%{ opacity:1; scale:1.08; } }

/* ---------- 배경 레이어 ---------- */
.blur39{ position:absolute; inset:0; filter:blur(39px); transition:filter .8s ease; }
.field{ position:absolute; left:28px; top:-132px; width:1022px; height:1053px;
        border-radius:50%; background:linear-gradient(180deg,#fff 23.89%,#f6e280 100%); }
.sheen{ position:absolute; left:413px; top:-72px; width:424px; height:420px;
        border-radius:50%; background:#def2ff; opacity:.82; filter:blur(100px); }
.core { position:absolute; left:330px; top:454px; width:332px; height:328px;
        border-radius:50%; background:#fdffde; filter:blur(100px); }
.cyan { position:absolute; left:31px; top:-186px; width:1116px; height:828px;
        opacity:.27; filter:blur(100px); }

.field,.sheen,.core,.cyan{
  transform-origin:50% 50%;
  transition:transform 1.8s cubic-bezier(.45,0,.15,1), opacity 1.2s ease,
             translate 1.2s ease, scale 1.2s ease, rotate 1.2s ease,
             border-radius 1.2s ease;
}

body.idle   .field{ transform:translate(1px,145.5px) scale(.22); }
/* 엄지척 대기 : 구슬이 커지면서 그대로 사라진다 (병원 로봇과 같게).
   옅게라도 남기면 화면 전체에 반투명한 흰 막이 깔린다 : 완전히 0 으로 */
body.fill   .field{ transform:translate(1px,145.5px) scale(.16); opacity:0; }   /* 커지며 흰 반투명이 남지 않게 : 어두워지며 작아진다 (병원과 같다) */
body.fill   .blur39{ filter:blur(30px); }
body.search .field{ transform:translate(1px,145.5px) scale(.58); opacity:0; }
body.full   .field{ transform:translate(1px,145.5px) scale(1.2); opacity:0; }
/* 새 장면들도 구슬은 다 사라진 상태 : .nv 가 걷힐 때 뒤에서 구슬이 드러나지 않게 */
body.src .field, body.srcfull .field, body.talk1 .field,
body.ready .field, body.reps .field{ transform:translate(1px,145.5px) scale(1.2); opacity:0; }
/* 색 블롭은 idle 에서만 : 검은 화면에선 파랗고 누렇게 비친다 */
body:not(.idle) .sheen, body:not(.idle) .core, body:not(.idle) .cyan{ opacity:0; }

body.idle .sheen{ opacity:0; }
body.idle .core, body.fill .core{ transform:scale(.4); opacity:0; }
body.search .core{ transform:translate(9px,-29px); }
body.idle .cyan, body.fill .cyan, body.search .cyan{
  transform:translate(9px,172.5px) scale(.469); opacity:.09;
}

/* 살아있는 구슬 : idle 에서만 배회하고, 채워진 뒤에는 고정 */
body.idle .field{
  animation:wander 30s linear      infinite,
            ripple  6s ease-in-out infinite,
            sway    7s ease-in-out infinite alternate;
}
/* 발광 링 : 구슬 바깥 테두리만 밝게. 안쪽 그라디언트는 원래대로 둔다 */
.field::before{
  content:''; position:absolute; inset:-9%; border-radius:inherit;
  opacity:0; transition:opacity .8s ease;
  background:conic-gradient(from 0deg,
    rgba(255,250,214,1) 0deg, rgba(255,246,196,.3) 100deg,
    rgba(255,246,196,.1) 190deg, rgba(255,248,204,.45) 280deg, rgba(255,250,214,1) 360deg);
  -webkit-mask:radial-gradient(circle closest-side, transparent 68%, #000 88%, #000 100%);
          mask:radial-gradient(circle closest-side, transparent 68%, #000 88%, #000 100%);
}
body.idle .field::before{ opacity:1; animation:gleam 9s ease-in-out infinite; }
@keyframes gleam{
   0%  { rotate:  0deg; opacity:.5;  }
  22%  { rotate:132deg; opacity:1;   }
  38%  { rotate: 98deg; opacity:.62; }
  62%  { rotate:254deg; opacity:1;   }
  80%  { rotate:222deg; opacity:.55; }
 100%  { rotate:360deg; opacity:.5;  }
}
body.idle .blur39{ filter:blur(17px); }
/* 정적 장면에서 .field 를 움직이면 검정이 드러난다. 고정하고 위의 블롭만 흘린다 */
body:not(.idle) .field{ animation:none; translate:0 0; scale:1; rotate:0deg; border-radius:50%; }
.sheen{ animation:drift2  9s ease-in-out infinite alternate; }
.core { animation:drift4 11s ease-in-out infinite alternate; }
.cyan { animation:drift3 13s ease-in-out infinite alternate; }
@keyframes wander{
   0%  { translate:  0px   0px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
   7%  { translate:-46px -30px; scale:1.09 .93;  animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  25%  { translate:-38px -22px; scale:1.01 1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  32%  { translate: 30px -54px; scale:.92  1.11; animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  48%  { translate: 24px -44px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  54%  { translate: 56px  18px; scale:1.08 .94;  animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  70%  { translate: 48px  14px; scale:1    1.01; animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  77%  { translate:-28px  48px; scale:.94  1.08; animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  93%  { translate:-22px  40px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
 100%  { translate:  0px   0px; scale:1    1;    }
}
@keyframes sway{ from{ rotate:-30deg; } to{ rotate:30deg; } }
@keyframes ripple{
   0%,100%{ border-radius:50% 50% 50% 50% / 50% 50% 50% 50%; }
  20%     { border-radius:63% 37% 44% 56% / 41% 59% 41% 59%; }
  40%     { border-radius:39% 61% 59% 41% / 59% 37% 63% 41%; }
  60%     { border-radius:57% 43% 37% 63% / 44% 63% 37% 56%; }
  80%     { border-radius:42% 58% 62% 38% / 61% 42% 58% 39%; }
}
@keyframes drift2{ to{ translate:-252px 344px; scale:1.72; } }
@keyframes drift3{ to{ translate:206px 322px; rotate:18deg; scale:1.28; } }

/* ---------- search : 엄지척 인식 뒤 별 모션 (병원 로봇과 같은 영상) ----------
   검정 위에 얹으므로 screen : 영상의 검은 부분은 배경이 그대로 비친다 */
.star{ position:absolute; inset:0; width:1080px; height:1080px; object-fit:cover; z-index:2;
       opacity:0; transition:opacity .45s ease; mix-blend-mode:screen; pointer-events:none; }
body.search .star{ opacity:1; }

/* ---------- search : 베젤 바로 안쪽이 숨쉬듯 일렁인다 ---------- */
.rim{
  position:absolute; inset:0; border-radius:50%; z-index:1; pointer-events:none;
  opacity:0; transition:opacity 1s ease;
  box-shadow:inset 0 0 52px 8px rgba(254,255,249,.28);
}
/* full 로 넘어가도 애니메이션은 계속 돌린다 (끊긴 느낌 방지). 사라지는 건 opacity 만 */
body.full   .rim{ animation:breathe 3.4s ease-in-out infinite; }
@keyframes breathe{
  0%,100%{ box-shadow:inset 0 0 44px  4px rgba(254,255,249,.2); }
  50%    { box-shadow:inset 0 0 104px 30px rgba(254,255,249,.45); }
}
.rim::after{
  content:''; position:absolute; inset:0; border-radius:inherit; opacity:0;
  background:radial-gradient(circle at 50% 3%, rgba(254,255,249,.3), transparent 44%);
  filter:blur(44px); transition:opacity 1s ease;
}
body.full   .rim::after{ animation:orbit 11s linear infinite; }
@keyframes orbit{ to{ rotate:360deg; } }

/* ---------- 문구 장면 : 병원 로봇(dab2n/baton)과 같은 스트로크 링 ----------
   full : 스크린 가장자리에 붙인 스트로크 (가장 밝은 선 약 518 = 가장자리 520, 바깥 글로우는 잘린다) */
/* z-index 3 : 스크린 안 콘텐츠보다 위, 노치(.bezel z4)보다 아래. screen 합성이라 링 글로우가 아래 것 위에 얹힌다 */
/* 스트로크 링 (레퍼런스 : 링 빛이 크게 번지고 안쪽은 검은 원이 또렷하게 자른다)
   .sring 한 묶음 = 흐린 영상(.sglow) + 바깥으로 갈수록 더 흐려지는 고리 세 겹(.pb) + 그 위 검은 원(.sdisc).
   z-index 0 : 뒤에 오는 문구보다 아래 (검은 원이 글자를 가리지 않게) */
.sring{ position:absolute; inset:0; z-index:0; pointer-events:none; opacity:0; transition:opacity .6s ease; }
.sglow{ position:absolute; inset:0; filter:blur(4px) brightness(1.25); }   /* 영상을 먼저 원형으로 자른 뒤 흐린다 : 사각 테두리 없이 번짐이 바깥으로 퍼진다 */
.pb{ position:absolute; inset:0; opacity:var(--pb, 1); transition:opacity .5s ease; }   /* 커지는 동안(--pb 0) 꺼서 등장이 매끄럽게 */
/* progressive : 링(R 410)에서 바깥으로 갈수록 흐림이 세진다 */
.pb1{ -webkit-backdrop-filter:blur(3px);  backdrop-filter:blur(3px);
  -webkit-mask:radial-gradient(circle at 540px 540px, transparent 404px, #000 420px); mask:radial-gradient(circle at 540px 540px, transparent 404px, #000 420px); }
.pb2{ -webkit-backdrop-filter:blur(6px);  backdrop-filter:blur(6px);
  -webkit-mask:radial-gradient(circle at 540px 540px, transparent 418px, #000 442px); mask:radial-gradient(circle at 540px 540px, transparent 418px, #000 442px); }
.pb3{ -webkit-backdrop-filter:blur(11px); backdrop-filter:blur(11px);
  -webkit-mask:radial-gradient(circle at 540px 540px, transparent 436px, #000 470px); mask:radial-gradient(circle at 540px 540px, transparent 436px, #000 470px); }
/* 검은 원 : 링보다 살짝 작게. 반지름이 숨쉬듯 조금씩 드나들어 빛의 안쪽 경계가 가장자리를 따라 일렁인다 */
/* 일렁이는 모양은 안쪽 <i> 를 자르고(JS discLoop) 바깥을 흐려 가장자리를 부드럽게 : 검은 도형이 있다는 인상 없이 빛이 안쪽으로 스며들게.
   (한 요소에 흐림과 자르기를 같이 주면 흐린 뒤 잘라 경계가 다시 또렷해진다) */
.sdisc{ position:absolute; inset:0; filter:blur(10px); }
.sdisc > i{ position:absolute; inset:0; background:#000; clip-path:circle(398px at 540px 540px); }
/* 링 빛도 아주 살짝 타원으로 흔들려 검은 원과 어긋나며 굵기가 둘레를 따라 달라진다 */
.sglow{ animation:ringWob 4.3s ease-in-out infinite; }
@keyframes ringWob{ 0%, 100%{ scale:1 1; } 25%{ scale:1.012 .992; } 50%{ scale:.994 1.01; } 75%{ scale:1.008 .996; } }
/* 등장 : 가운데의 작은 고리에서 부드럽게 커지며, 처음엔 어둡다가 다 커졌을 때 완전히 밝게 */
@keyframes ringIn{ 0%{ scale:.16; filter:brightness(.22); } 55%{ filter:brightness(.55); } 100%{ scale:1; filter:brightness(1); } }
.stroke{ position:absolute; inset:0; width:1080px; height:1080px; object-fit:cover;
         scale:.8;     /* 링을 가장자리가 아니라 안쪽에 : 밝은 선 R 513 × .8 ≈ 410 (스크린 520 의 75%, 레퍼런스 실측) */
         /* 줄이면 영상 프레임(1080) 끝이 사각으로 보인다 → 링 바로 바깥에서 원형으로 흐려 끊는다 (흐림은 부모 .sglow 에서) */
         -webkit-mask:radial-gradient(circle closest-side, #000 94%, transparent 100%);
                 mask:radial-gradient(circle closest-side, #000 94%, transparent 100%);
         pointer-events:none; }
/* 엄지척(별 모션) 뒤 첫 문장부터 스트로크가 가운데에서 커진다 (병원 로봇과 같은 등장) */
body.full .sring{ opacity:1; animation:ringIn 1.7s cubic-bezier(.22,.61,.2,1) both; }
/* 스트로크가 도는 동안은 영상만 : 위아래 색 띠와 가장자리 발광을 끈다 */
body.full .screen::before, body.full .screen::after, body.full .rimlight{ opacity:0; }

/* ================= 새 디자인 (피그마 3971:702 · 일곱 프레임) =================
   맥락출처로딩중 → 맥락출처 → 맥락_대화1 → Ready → 카운팅 → 피드백.
   한 컴포넌트(.nv-pill)가 늘어나고 줄며 안의 내용만 밀려 들어온다.
   프레임 border 가 50px 이라 코드젠 좌표 + 50 = 이 1080 상자 좌표 */
.nv{ position:absolute; inset:0; width:1080px; height:1080px; z-index:3; pointer-events:none;
  opacity:0; visibility:hidden; transition:opacity .6s ease, visibility 0s linear .6s;
  --spring:cubic-bezier(.34,1.32,.5,1); --bouncy:cubic-bezier(.22,1.45,.36,1); }

/* ---------- 피드백 : 아래에서 떠오르는 빛 (AI 보이스처럼 늘 일렁인다) ---------- */
.nv-glow{ position:absolute; inset:0; opacity:0; translate:0 7%;

@keyframes vui1{ 0%,100%{ transform:translate(0,0) scale(1); filter:brightness(1); }
  34%{ transform:translate(-22px,-9px) scale(1.05); filter:brightness(1.12); }
  67%{ transform:translate(16px,5px) scale(.97); filter:brightness(.93); } }
@keyframes vui2{ 0%,100%{ transform:translate(0,0) scale(1); filter:brightness(1); }
  30%{ transform:translate(14px,-13px) scale(1.08); filter:brightness(1.15); }
  64%{ transform:translate(-18px,7px) scale(.94); filter:brightness(.9); } }
/* 피드백 문구 : 빛 위에 겹쳐(overlay) 푸른 기운을 머금는다 (두 겹) */
.nv-pull{ position:absolute; left:0; right:0; bottom:135.27px; margin:0; text-align:center;
  font-family:var(--ff-en,'Magnetik'), sans-serif; font-weight:500;
  font-size:54px; line-height:1.04; letter-spacing:-0.02em; isolation:isolate;
  opacity:0; translate:0 18px; transition:opacity .6s ease, translate .7s var(--bouncy); }
.nv.fb .nv-pull{ opacity:1; translate:0 0; }
.nv-pull b{ display:block; font:inherit; letter-spacing:inherit; mix-blend-mode:overlay;
  background:linear-gradient(90deg,#fff 61.44%,#b9d3e2 100%);
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.nv-pull .b2{ position:absolute; left:0; right:0; top:0; opacity:.65; }
/* ---------- 아래 안내 글 ---------- */
.nv-cta{ position:absolute; left:0; right:0; bottom:153.27px; margin:0; text-align:center;
  font-family:var(--ff-ko,'SF Pro KR'), 'Pretendard Web', sans-serif; font-weight:500;
  font-size:32px; line-height:1.2; letter-spacing:-0.02em; color:rgba(79,79,79,.4);
  opacity:0; translate:0 10px; transition:opacity .6s ease, translate .6s var(--bouncy); }
.nv-cta.on{ opacity:1; translate:0 0; }
/* .nv 가 걷히는 동안은 안쪽 레이어가 되돌아가지 않게 (흰 바탕이 번쩍이지 않는다) */
body:not(.src):not(.srcfull):not(.talk1):not(.ready):not(.reps) .nv *,
body:not(.src):not(.srcfull):not(.talk1):not(.ready):not(.reps) .nv *::before,
body:not(.src):not(.srcfull):not(.talk1):not(.ready):not(.reps) .nv *::after{ transition-delay:.75s !important; }
/* 새 장면에서는 앞 장면 배경 레이어를 비운다 */
body.src .screen::before, body.src .screen::after, body.srcfull .screen::before, body.srcfull .screen::after,
body.talk1 .screen::before, body.talk1 .screen::after, body.ready .screen::before, body.ready .screen::after,
body.reps .screen::before, body.reps .screen::after,
body.src .rimlight, body.srcfull .rimlight, body.talk1 .rimlight, body.ready .rimlight, body.reps .rimlight,
body.src .sring, body.srcfull .sring, body.talk1 .sring, body.ready .sring, body.reps .sring,
body.src .rim, body.srcfull .rim, body.talk1 .rim, body.ready .rim, body.reps .rim{ opacity:0; transition:none; }

/* 반응이 없으면(15s) 또는 사람이 보이지 않으면(4s) 문구가 아래로 빠지며 기본 화면으로 (병원과 같다) */
body.fill.leave .stage > *{ translate:0 110px; opacity:0;
  transition:translate .8s cubic-bezier(.55,0,.8,.35), opacity .7s ease; }
/* ---------- 본문 : 한 장면 = 카운터 + 문장 + 부가정보 ---------- */
/* flex 로 세로 중앙 정렬 — 줄 수·구성이 달라도 항상 스크린 정중앙 */
.stage{
  /* .rim(z1) 보다 뒤 DOM 이라 z-index 없이도 위에 온다 */
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:26px; padding:0 100px; pointer-events:none;
}
.stage > *{ margin:0; text-align:center; color:#fff;
  /* 스트로크 링을 화면 안쪽(R 380)으로 옮기면서 글자도 레퍼런스(병원 인사 48px)에 맞춰 통째로 줄인다 : 76 → 48.
     zoom 이라 숫자 도트·번짐(em)·줄 간격이 비율 그대로 같이 줄어든다 (병원 로봇 문장과 같은 36px) */
  zoom:1; }   /* 스크린이 작아 병원보다 크게 : 피그마(헬스장) 기준 문장 80px · 부가정보 44px */

/* 숫자 : 병원 로봇 길안내와 같은 5x7 도트 (폰트 대신 직접 그린다).
   숫자가 바뀔 때는 자리를 옮기지 않고 칸마다 불이 꺼지고 켜지며 한 칸씩 올라간다 */
.headline{ font-size:68px; font-weight:500; line-height:1.4; }   /* 피그마 3590:7370 · 줄바꿈은 문구에 직접 준다 */
.meta    { font-size:44px; font-weight:400; line-height:1.4; color:rgba(255,255,255,.8); }
.headline.small{ font-size:68px; }   /* 맥락 전달 전·후 크기를 하나로 */
/* 한국어 문장 : 병원 ui 와 같은 규칙 — 글자체(SF Pro KR) · 자간 -2% · 굵기 500 · 행간 1.42 · 단색 #E5E5E5 · 번짐 없음.
   UI 마다 다른 건 크기뿐 (헬스장 68px) */
.headline.ko, .headline.ko *{ letter-spacing:-0.02em; }
.headline.ko{ font-weight:500; line-height:1.42; filter:none; }
.headline.ko .c{ background:none; color:#E5E5E5; }
/* 글자는 흰색이 줄 박스 66% 까지 가득하고 아래 끝에서만 살짝 옅어진다. 강조어는 흰색 그대로 + 글리밍.
   색은 글자(.c)마다 입힌다 : 단어(.w)에 입히면 background-clip:text 가 아직 안 켜진 글자까지 그려 단어가 통째로 먼저 보인다 */
.stage .c{ background:linear-gradient(180deg,#fff 0 32%,#fcf9ea 52%,#e2f6fb 74%,rgba(186,232,246,.8) 100%);
           -webkit-background-clip:text; background-clip:text; color:transparent;
           padding:0 .08em; margin:0 -.08em; }   /* 흰빛 → 아주 옅은 노랑 → 옅은 청록 · Magnetik 의 T 처럼 상자 밖으로 나가는 글자가 잘리지 않게 */
.stage em{ font-style:normal; font-weight:600; display:inline-block; }
.stage em .c{ background:none; color:#fffdf0; }
.headline .ln, .headline, .meta{ animation:auraDrift 9.2s ease-in-out infinite; }
.glim::before{ color:#d9f5ff; }   /* 안쪽 겹 : 옅은 청록 */
.glim::after { color:#ffe9a8; }   /* 바깥 번짐 : 아주 옅은 노랑 */
/* 글리밍 : 같은 글자를 #FEFFF9 로 한 겹 더 얹고 오른쪽으로 갈수록 흐리게. 글자와 같은 시각에 함께 떠오른다
   blur 를 em 단위로 : 헬스장은 글자가 76px 이라 px 로 고정하면 번짐이 너무 작다 */
.glim{ position:relative; }
.glim::before, .glim::after{ content:attr(data-t); position:absolute; left:0; top:0;
  color:#FEFFF9; white-space:nowrap; pointer-events:none; text-align:left; opacity:0;
  animation:glimWipe calc(var(--tn) * 1ms + 1300ms) cubic-bezier(.3,.5,.4,1) both;
  animation-delay:calc(var(--t0) * 1ms); }   /* 강조어의 첫 글자가 켜질 때 시작해 마지막 글자까지 훑는다 */
/* 마스크 두 겹 : 오른쪽으로 갈수록 짙어지는 번짐 + 왼→오로 열리는 와이프 (교집합).
   글자가 왼쪽부터 나타나는 것과 같은 방향·같은 시각에 번짐이 따라온다 */
.glim::before, .glim::after{
  -webkit-mask-repeat:no-repeat;   mask-repeat:no-repeat;
  -webkit-mask-position:0 0, 0 0;  mask-position:0 0, 0 0;
  -webkit-mask-size:100% 100%, 140% 100%;  mask-size:100% 100%, 140% 100%;
  -webkit-mask-composite:source-in;        mask-composite:intersect; }
.glim::before{ filter:blur(1px);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%), linear-gradient(90deg,#000 0 68%, transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0%,#000 22%), linear-gradient(90deg,#000 0 68%, transparent 100%); }
.glim::after { filter:blur(2px);
  -webkit-mask-image:linear-gradient(90deg,transparent 5%,#000 45%), linear-gradient(90deg,#000 0 68%, transparent 100%);
          mask-image:linear-gradient(90deg,transparent 5%,#000 45%), linear-gradient(90deg,#000 0 68%, transparent 100%); }
@keyframes glimWipe{
  from{ opacity:0; -webkit-mask-size:100% 100%, 0% 100%;   mask-size:100% 100%, 0% 100%;   }
  8%  { opacity:1; }
  65% { opacity:1; -webkit-mask-size:100% 100%, 140% 100%; mask-size:100% 100%, 140% 100%; }
  to  { opacity:.42; -webkit-mask-size:100% 100%, 140% 100%; mask-size:100% 100%, 140% 100%; }   /* 다 쓰이면 번짐을 줄여 읽히게 */
}

.w{ display:inline-block; }   /* 단어는 줄바꿈 묶음만. 보이기·애니메이션은 글자(.c)에서 */
.stage .ln{ display:block; }
/* 두 줄 문장 원칙(병원 로봇과 같다) : 첫 줄이 가운데에 먼저 쓰이고, 둘째 줄이 나오기 직전 반 줄 위로 */
@keyframes lineUp{ from{ translate:0 .5lh; } to{ translate:0 0; } }
.stage .two{ animation:lineUp .6s cubic-bezier(.4,0,.2,1) both; animation-delay:calc(var(--t2) * 1ms - 120ms); }

/* ---------- 문장 등장 (병원 로봇과 같은 규칙) ----------
   문장 단위로 왼쪽부터 한 글자씩 흘러나오고, 가장 최근에 나타난 글자에 유리·비눗방울 같은 색 번짐.
   색은 엄지척 구에서 : 흰 핵 · 연두 · 파랑 · 하늘 (글자마다 두 색 짝 --g1/--g2). 일반 글자는 옅게, 강조어는 짙게.
   강조어는 켜진 뒤에도 번짐이 글자를 따라 물결처럼 일렁인다. 번짐·흐림 크기는 em 단위 (글자가 52~240px 로 제각각) */
@keyframes letterIn{   /* 병원 로봇과 같은 값(px) : em 으로 주면 글자가 커질수록 번짐이 과해 끊겨 보인다 */
  0%   { opacity:0; filter:blur(2px) drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 0 0 rgba(0,0,0,0)); }
  38%  { opacity:1; filter:blur(0)   drop-shadow(0 0 5px var(--g1)) drop-shadow(0 0 13px var(--g2)); }
  100% { opacity:1; filter:blur(0)   drop-shadow(0 0 2.1px var(--g1)) drop-shadow(0 0 6.5px var(--g2)); }   /* 0 으로 꺼지지 않고 옅게 남는다 */
}
/* ---------- 글자에 남는 부드러운 컬러 글로우 ----------
   색은 전체 플로우에 반복해 쓰는 것들 : 크림(#FFF5D3) · 민트(#8AFFF3) · 하늘(#B7E4FF).
   밝기는 높게, 농도는 낮게 유지해 글자를 덮지 않고 뒤에서만 은은히 돈다 */
@keyframes auraDrift{
  0%, 100%{ filter:drop-shadow(0 0 .17em rgba(255,245,211,.26)) drop-shadow(0 0 .36em rgba(255,236,172,.17)); }
  34%     { filter:drop-shadow(0 0 .18em rgba(190,247,240,.26)) drop-shadow(0 0 .38em rgba(138,255,243,.16)); }
  67%     { filter:drop-shadow(0 0 .17em rgba(183,228,255,.28)) drop-shadow(0 0 .37em rgba(150,224,250,.17)); }
}

@keyframes emGlow{
  from{ filter:blur(0) drop-shadow(0 0 .4px var(--g1)) drop-shadow(0 0 1px var(--g2)); }
  to  { filter:blur(0) drop-shadow(0 0 1.1px var(--g1)) drop-shadow(0 0 2.6px var(--g2)); }   /* 가장자리만 얇게 (병원과 같은 값) */
}
.stage .c{ animation:letterIn .95s cubic-bezier(.25,.6,.3,1) both; animation-delay:calc(var(--t) * 1ms); }
.stage em .c{ animation:letterIn .95s cubic-bezier(.25,.6,.3,1) both, emGlow 2.4s ease-in-out infinite alternate;
  animation-delay:calc(var(--t) * 1ms), calc(var(--ei) * 90ms + var(--t0) * 1ms + .95s); }

@media (prefers-reduced-motion:reduce){
  .w, .c{ animation:none; opacity:1; filter:none; }
  .field,.sheen,.core,.cyan,.rim,.rim::after{ animation:none; }
}
</style>

<script>

// 텍스트를 단어(.w) 단위로 감싼다 : 줄바꿈이 단어 가운데서 일어나지 않게 하는 묶음
const split = el => {
  const walk = node => {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        for (const part of child.data.split(/(\s+)/)) {
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.append(part); continue; }
          const s = document.createElement('span');
          s.className = 'w'; s.textContent = part;
          frag.append(s);
        }
        child.replaceWith(frag);
      } else if (child.tagName !== 'BR') { walk(child); }
    }
  };
  walk(el);
};

// 문장 단위로 한 글자씩 (병원 로봇과 같은 규칙) : 단어 안 글자를 인라인 .c 로 쪼개 글자마다 시작 시각 --t(ms).
//  · 한 줄 안에서는 글자(띄어쓰기 한 칸 포함)가 30ms 간격으로 끊김 없이 흘러나온다 (등장 0.95s 라 겹쳐 번진다)
//  · 문장 끝(.?!…) 뒤 +450ms. 한 호흡 문장(hold1)은 쉬지 않는다
//  · 일반 글자 번짐은 옅은 색, 강조어(em)는 짙은 색. 강조어에는 첫 글자 시각 --t0, 길이 --tn, 강조어 안 순서 --ei
//  · inline span 이라 커닝이 끊기지 않는다
const GLOW_EM   = [['rgba(255,245,211,.95)', 'rgba(140,212,250,.6)'],    // 크림 · 하늘
                   ['rgba(190,247,240,.95)', 'rgba(255,236,172,.55)'],   // 민트 · 크림
                   ['rgba(183,228,255,.95)', 'rgba(138,255,243,.5)']];   // 하늘 · 민트
const GLOW_SOFT = GLOW_EM.map(pair => pair.map(c => c.replace(/[\d.]+\)$/, a => (parseFloat(a) * .35).toFixed(2) + ')')));
const STEP = 30;
const letters = (el, t, hold1, rate = 1) => {
  const words = [...el.querySelectorAll('.w')];
  words.forEach((w, wi) => {
    const text = w.textContent; w.textContent = '';
    const em = !!w.closest('em');
    [...text].forEach((ch, j) => {
      const c = document.createElement('span');
      c.className = 'c'; c.textContent = ch;
      c.style.setProperty('--t', Math.round(t));
      const [g1, g2] = (em ? GLOW_EM : GLOW_SOFT)[(wi + j) % 3];
      c.style.setProperty('--g1', g1); c.style.setProperty('--g2', g2);
      w.append(c);
      t += STEP * rate;
    });
    const next = words[wi + 1];
    if (next) {
      const lineBreak = next.closest('.ln') !== w.closest('.ln');
      const endsSentence = /[.?!…]$/.test(text);
      t += (STEP + (!hold1 && endsSentence ? 450 : 0) + (lineBreak && endsSentence ? 380 : 0)) * rate;   // 한 문장이 두 줄로 넘어갈 땐 쉬지 않는다
    }
  });
  // 두 줄 : 둘째 줄 첫 글자 시각(--t2) — 그때 문장이 반 줄 위로 올라간다
  const lns = el.querySelectorAll('.ln');
  el.classList.toggle('two', lns.length > 1);
  if (lns.length > 1) el.style.setProperty('--t2', lns[1].querySelector('.c')?.style.getPropertyValue('--t') ?? 0);
  el.querySelectorAll('em').forEach(em => {
    const cs = [...em.querySelectorAll('.c')];
    if (!cs.length) return;
    const t0 = +cs[0].style.getPropertyValue('--t'), t1 = +cs.at(-1).style.getPropertyValue('--t');
    em.style.setProperty('--t0', t0); em.style.setProperty('--tn', t1 - t0);
    cs.forEach((c, n) => c.style.setProperty('--ei', n));
  });
  return t;
};

  '4': '00010,00110,01010,10010,11111,00010,00010',
  '5': '11111,10000,10110,11001,00001,10001,01110',
  '6': '00111,01000,10000,11110,10001,10001,01110',
  '7': '11111,00001,00001,00010,00100,00100,00100',
  '8': '01110,10001,10001,01110,10001,10001,01110',

  '\u00b9': '11100,00100,00100,00100,00100,00100,11111',
};
const NUMP = 100, NUMDR = 47, NUMADV = 650;   // 칸 간격 · 도트 반지름 · 글자 보내기
const NDOTS = {};
const numDotsFor = ch => NDOTS[ch] ??= (() => {
  const rows = NUMDOT[ch].split(',');
  const dots = [];
  rows.forEach((line, r) => [...line].forEach((b, c) => {
    if (b === '1') dots.push({ x: c * NUMP + NUMDR, y: r * NUMP + NUMDR });
  }));
  return { dots, r: NUMDR, adv: NUMADV,
           w: (rows[0].length - 1) * NUMP + 2 * NUMDR, h: (rows.length - 1) * NUMP + 2 * NUMDR };
})();
// 피그마 실측 : 숫자 높이 278.863 (도트 Ø37.771 · 칸 40.182)
const NUMH = 278.863, NUMW = 520;
const SVGNS = 'http://www.w3.org/2000/svg';
const numPool = host => {
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', `0 0 ${NUMW} ${NUMH}`);
  host.append(svg);
  return [...Array(45)].map(() => {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', NUMW / 2); c.setAttribute('cy', NUMH / 2); c.setAttribute('r', 3);
    c.style.opacity = 0; svg.append(c); return c;
  });
};
const numPools = [numPool(gPale), numPool(gFill)];
let numShown = '';
const setNum = str => {
  if (str === numShown) return;
  numShown = str;
  const gs = [...str].map(numDotsFor);
  const k = NUMH / gs[0].h;
  const wid = gs.reduce((a, g, i) => a + (i < gs.length - 1 ? g.adv : g.w) * k, 0);
  let x = (NUMW - wid) / 2;
  const pts = [];
  gs.forEach(g => { for (const d of g.dots) pts.push([x + d.x * k, d.y * k, g.r * k]); x += g.adv * k; });
  // 실제 도트가 차지한 범위로 다시 가운데 맞춤
  const l = Math.min(...pts.map(p => p[0] - p[2])), rr = Math.max(...pts.map(p => p[0] + p[2]));
  const dx = NUMW / 2 - (l + rr) / 2;
  for (const p of pts) p[0] += dx;
  for (const pool of numPools) pool.forEach((c, i) => {
    if (i < pts.length) {
      c.setAttribute('cx', pts[i][0].toFixed(1)); c.setAttribute('cy', pts[i][1].toFixed(1));
      c.setAttribute('r', pts[i][2].toFixed(2)); c.style.opacity = 1;
    } else c.style.opacity = 0;

};

  const w = str.length * NUMADV, h = 6 * NUMP + 2 * NUMDR;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  for (const [cx, cy] of pts) {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', cx + NUMDR); c.setAttribute('cy', cy); c.setAttribute('r', NUMDR); svg.append(c);
  }
  return svg;
};

let gymRAF, gymTimer;
const gymStop = () => { clearTimeout(gymTimer); cancelAnimationFrame(gymRAF); };

// 카운팅 : 당길수록 옅은 숫자가 아래에서 위로 흰색으로 차고, 다 차면 다음 숫자로.
// 첫 회는 Ready 에서 차 있던 자리(0.56)부터 이어 받는다 — 숫자가 한 번도 뒤로 가지 않는다
const runReps = (s, n) => {
  gSetDots.forEach((d, i) => d.classList.toggle('on', i === +s.set - 1));
  let rep = 1;
  const pull = () => {
    const from = rep === 1 ? READY_FILL : 0;
    gNum.style.setProperty('--fill', from);
    setNum(String(rep));
    if (rep === s.feedbackAt) NV.classList.add('fb');
    // 랫풀다운 한 번의 속도 : 쉼 0.4s + 당김 1.15s + 버팀 0.32s
    const REST = rep === 1 ? 650 : 400, PULL = 1150, HOLD = 320;
    gymTimer = setTimeout(() => {
      const t0 = performance.now();
      const step = () => {
        const t = performance.now() - t0;
        const e = Math.min(1, t / PULL);
        // 앞은 당기기 시작하듯 천천히, 뒤에서 쫀득하게 차올라 부드럽게 안착
        const u = e ** 2.1, kk = u * u * (3 - 2 * u);
        gNum.style.setProperty('--fill', (from + (1 - from) * kk).toFixed(3));
        if (t < PULL + HOLD) { gymRAF = requestAnimationFrame(step); return; }
        if (rep === s.feedbackAt + 2) NV.classList.remove('fb');   // 자세가 돌아오면 사라진다
        if (rep++ >= s.reps) { gymTimer = setTimeout(() => go(n + 1 >= SCENES.length ? 0 : n + 1), 900); return; }
        pull();
      };
      step();
    }, REST);
  };
  pull();
};

};

const bandc = document.querySelector('.bandc'), bx = bandc.getContext('2d');
const bandTmp = new OffscreenCanvas(540, 540), tx = bandTmp.getContext('2d');
const bez = (x1, y1, x2, y2) => x => {   // CSS cubic-bezier 와 같은 곡선
  let lo = 0, hi = 1, t = x;
  for (let i = 0; i < 24; i++) { t = (lo + hi) / 2; const bx = 3 * x1 * t * (1 - t) ** 2 + 3 * x2 * t * t * (1 - t) + t ** 3; bx < x ? lo = t : hi = t; }
  return 3 * y1 * t * (1 - t) ** 2 + 3 * y2 * t * t * (1 - t) + t ** 3;

const BANDS = [
  { stops: [[.44, 'rgba(15,22,39,0)'], [.70, 'rgba(15,22,39,.3)'], [.88, 'rgba(15,22,39,.62)'], [.98, '#0F1627'], [1, '#0F1627']],
    lin: e => [[0, 1], [.06 + .29 * e, 1], [.20 + .32 * e, .9], [.32 + .34 * e, .55], [.58 + .34 * e, 0]], top: true },
  { stops: [[.52, 'rgba(61,61,61,0)'], [.78, 'rgba(61,61,61,.12)'], [.92, 'rgba(61,61,61,.24)'], [.99, 'rgba(61,61,61,.62)'], [1, 'rgba(61,61,61,.62)']],
    lin: e => [[0, 1], [.02 + .30 * e, 1], [.12 + .33 * e, .5], [.26 + .36 * e, .26], [.46 + .36 * e, 0]], top: false },
];
const drawBands = (a0, a1, ext, alpha, endFade = 0, bandAlpha = [1, 1]) => {
  bx.clearRect(0, 0, 540, 540);
  if (alpha <= 0 || a1 <= a0) return;
  // 원뿔 마스크 (각도는 12시 기준, 시계 방향) : 꼬리 a0 → +30° 불투명 … 머리 a1-30° → a1 투명
  const p = a => clamp01(a / 360);
  const o1 = p(Math.min(a0 + 30, a1 - 30)), o2 = Math.max(o1, p(a1 - 30)), o3 = Math.max(o2, p(a1));
  const cone = tx.createConicGradient(-Math.PI / 2, 270, 270);
  cone.addColorStop(p(a0), 'rgba(0,0,0,0)'); cone.addColorStop(Math.max(p(a0), o1), '#000');
  if (endFade > 0) {   // 지울 때 : 12시 바로 왼쪽(끝)도 함께 흐려 이음매가 서지 않게
    const oe = Math.max(o1, 1 - 40 / 360 * endFade);
    cone.addColorStop(oe, '#000'); cone.addColorStop(1, `rgba(0,0,0,${(1 - endFade).toFixed(3)})`);
  } else { cone.addColorStop(o2, '#000'); cone.addColorStop(o3, 'rgba(0,0,0,0)'); }
  BANDS.forEach((B, bi) => {
    tx.globalCompositeOperation = 'source-over'; tx.clearRect(0, 0, 540, 540);
    const rg = tx.createRadialGradient(270, 270, 0, 270, 270, 265);
    B.stops.forEach(([o, c]) => rg.addColorStop(o, c));
    tx.fillStyle = rg; tx.fillRect(0, 0, 540, 540);
    tx.globalCompositeOperation = 'destination-in';
    const lg = B.top ? tx.createLinearGradient(0, 0, 0, 540) : tx.createLinearGradient(0, 540, 0, 0);
    B.lin(ext).forEach(([o, a]) => lg.addColorStop(clamp01(o), `rgba(0,0,0,${a})`));
    tx.fillStyle = lg; tx.fillRect(0, 0, 540, 540);
    tx.fillStyle = cone; tx.fillRect(0, 0, 540, 540);
    bx.globalAlpha = alpha * bandAlpha[bi]; bx.drawImage(bandTmp, 0, 0); bx.globalAlpha = 1;
  });
};
const eraseBands = () => {
  cancelAnimationFrame(bandRAF);
  body.classList.add('eraseb'); bandc.classList.add('on');
  const t0 = performance.now();
  const f = () => {
    const t = (performance.now() - t0) / 1000;
    if (t > 1.4) { bx.clearRect(0, 0, 540, 540); bandc.classList.remove('on'); body.classList.remove('eraseb'); return; }
    drawBands(400 * sweepEase(clamp01(t / 1.3)) - 40, 400, 0, 1, clamp01(t / .35));   // 인사 때 모습 그대로에서 12시부터 돌며 지운다
    bandRAF = requestAnimationFrame(f);
  };
  f();
};
let bandRAF;
const bandsRun = (look = 'fill') => {
  cancelAnimationFrame(bandRAF);
  const t0 = performance.now(); let outAt = 0;
  const frame = () => {
    if (!body.classList.contains(look)) { bx.clearRect(0, 0, 540, 540); return; }
    const t = (performance.now() - t0) / 1000;
    const a1 = 390 * sweepEase(clamp01((t - .3) / 1.7));
    const a0 = t < 1.7 ? 0 : -30 * clamp01((t - 1.7) / .3);
    const ext = t < 2 ? 1 : 1 - extEase(clamp01((t - 2) / 1.4));
    if (body.classList.contains('leave') && !outAt) outAt = t;
    const alpha = outAt ? 1 - clamp01((t - outAt) / .8) : 1;
    drawBands(a0, a1, ext, alpha);
    bandRAF = requestAnimationFrame(frame);
  };
  frame();
};

// 안내를 보고 있지 않으면(15s 무응답 · 사람이 4s 안 보이면) 문구가 아래로 빠지며 대기 상태로 (병원과 같다)
const leaveFill = () => {
  if (!body.classList.contains('fill') || body.classList.contains('leave')) return;
  body.classList.add('leave');
  clearTimeout(timer); timer = setTimeout(() => go(0), 850);
};
window.__leaveFill = leaveFill;
const go = n => {
  clearTimeout(timer);
  idx = n;
  const s = SCENES[n];
  // idle 에서 나갈 때 : 배회 애니메이션을 끊으면 translate 가 0 으로 튀어 다른 물체처럼 보인다.
  // 지금 값을 인라인으로 물려 class 를 바꾸고 다음 프레임에 지워, 전환이 그 자리에서 이어지게 한다
  if (body.classList.contains('idle') && s.look !== 'idle') {
    const cs = getComputedStyle(field);
    field.style.translate = cs.translate; field.style.rotate = cs.rotate;
    field.style.borderRadius = cs.borderRadius;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      field.style.translate = field.style.rotate = field.style.borderRadius = '';
    }));
  }
  if (s.look === 'idle' && body.classList.contains('bye')) eraseBands();   // 인사 뒤 : 색 띠를 돌려 지우며 구슬이 떠오른다
  if (s.look === 'fill' || s.look === 'bye') requestAnimationFrame(() => bandsRun(s.look));
  if (s.look === 'fill') { window.__fillAt = performance.now(); timer = setTimeout(leaveFill, 15000); }
  body.className = [
    body.classList.contains('bare')  ? 'bare'  : '',
    body.classList.contains('kiosk') ? 'kiosk' : '',
    body.classList.contains('shot')  ? 'shot'  : '',   // 투명 배경 내보내기 유지
    body.classList.contains('nocam') ? 'nocam' : '',   // 카메라 영역 토글도 장면이 바뀌어도 남는다
    body.classList.contains('rec')   ? 'rec'   : '',   // 영상용 플래그도 장면이 바뀌어도 남는다
    s.look,
  ].filter(Boolean).join(' ');
  draw(s);
  if (s.look === 'search') { star.currentTime = 0; star.play().catch(() => {}); } else star.pause();
  // 스트로크는 search 부터 미리 돌려 둔다 (보이지 않는 동안 디코딩을 마쳐 등장 첫 프레임이 끊기지 않게)
  if (s.look === 'search') { stroke.currentTime = RSTART; sring.style.setProperty('--pb', 0); clearTimeout(pbTimer); }
  if (s.look === 'search' || s.look === 'full') stroke.play().catch(() => {});
  else { stroke.pause(); stroke.currentTime = RSTART; }
  if (s.look === 'full' && SCENES[n - 1]?.look !== 'full') {   // 스트로크가 커지는 동안만
    sring.style.setProperty('--pb', 0);
    clearTimeout(pbTimer); pbTimer = setTimeout(() => sring.style.removeProperty('--pb'), 1700);
  }
  if (s.hold) timer = setTimeout(() => go(n + 1 >= SCENES.length ? 0 : n + 1), s.hold);   // 마지막(인사) 뒤엔 대기 상태로
};
// 카메라가 없을 때의 수동 진행 : 한 단계씩, 마지막에서 리셋
const tap = () => go(idx >= SCENES.length - 1 ? 0 : idx + 1);
window.__go = go; window.__step = () => idx;

const jump = document.querySelector('.jump');
jump.addEventListener('pointerdown', e => e.stopPropagation());
jump.addEventListener('click', e => { const k = e.target.closest('[data-go]')?.dataset.go; if (k != null) { e.preventDefault(); e.stopPropagation(); go(+k); } }, true);
const JUMPS = [0, 2, 3, 5, 6, 7];   // 버튼 data-go 와 같은 장면 번호
setInterval(() => {
  const cur = [...JUMPS].reverse().find(n => idx >= n) ?? 0;
  for (const b of jump.children) b.classList.toggle('on', +b.dataset.go === cur);
}, 250);
const toggle = document.querySelector('.toggle');
toggle.addEventListener('pointerdown', e => e.stopPropagation());
toggle.addEventListener('click', () => {
  const off = body.classList.toggle('bare');
  toggle.setAttribute('aria-pressed', String(!off));
  fit();
});
const camToggle = document.querySelector('.toggle.camt');
camToggle.addEventListener('pointerdown', e => e.stopPropagation());
camToggle.addEventListener('click', e => {
  e.stopPropagation();
  camToggle.setAttribute('aria-pressed', String(!body.classList.toggle('nocam')));
});

const SOLO = new URLSearchParams(location.search).get('s');

if (SOLO === null) {
  addEventListener('pointerdown', tap);
  addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') tap(); });
  go(0);
} else {
  // 한 장면만 정지 : 자동 진행도 카메라도 없다
  body.classList.add('bare', 'kiosk', 'shot');
  go(+SOLO);
  clearTimeout(timer);
  fit();
}
</script>

<script type="module">
/* ---------- 카메라 인터랙션 (병원 로봇과 동일 스펙) ----------
   장면 0 : 얼굴이 가까워지면(≈30cm 이내) 원이 커진다
   장면 1 : 엄지척을 올리면 다음 단계로 넘어간다
   카메라/권한이 없으면 조용히 꺼지고 탭 조작만 남는다. */

// ponytail: 웹캠 화각마다 다르므로 실기기에서 이 값들만 보정한다.
const NEAR = .34;   // 얼굴 폭 ÷ 프레임 폭. 화각 65° 기준 0.34 ≈ 30cm, 0.5 ≈ 20cm
const HITS = 3;     // 트리거까지 필요한 누적 프레임
const GMIN = .35;   // 엄지척으로 인정할 최소 점수

const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18';
const M = 'https://storage.googleapis.com/mediapipe-models';
const stat  = document.querySelector('.camstat');
const video = document.getElementById('camv');
const cv    = document.getElementById('camc');
const cx    = cv.getContext('2d');
const say   = t => { stat.textContent = t; };

let fd, gr, hits = 0, last = -1, faceAt = 0;

const loop = () => {
  requestAnimationFrame(loop);
  const t = performance.now();
  if (t - last < 100) return;          // 10fps 면 충분
  last = t;
  if (!video.videoWidth) return;

  const face = fd.detectForVideo(video, t).detections[0];
  const hand = gr.recognizeForVideo(video, t);
  const ratio = face ? face.boundingBox.width / video.videoWidth : 0;
  const g = (hand.gestures ?? []).map(c => c[0]).filter(Boolean)
              .sort((x, y) => y.score - x.score)[0];
  const up = (hand.gestures ?? []).some(c => c.some(k => k.categoryName === 'Thumb_Up' && k.score >= GMIN));

  const sx = cv.width / video.videoWidth, sy = cv.height / video.videoHeight;
  cx.clearRect(0, 0, cv.width, cv.height);
  if (face) {
    const b = face.boundingBox;
    cx.strokeStyle = ratio >= NEAR ? '#3ddc84' : '#ffcc00';
    cx.lineWidth = 3;
    cx.strokeRect(b.originX * sx, b.originY * sy, b.width * sx, b.height * sy);
  }
  for (const marks of hand.landmarks ?? []) {
    cx.fillStyle = up ? '#3ddc84' : '#4aa8ff';
    for (const p of marks) {
      cx.beginPath(); cx.arc(p.x * cv.width, p.y * cv.height, 3, 0, 6.284); cx.fill();
    }
  }

  const n = window.__step();
  if (face) faceAt = t;
  if (n === 1 && t - Math.max(faceAt, window.__fillAt || 0) > 4000) window.__leaveFill();   // 안내를 보고 있지 않으면
  say('얼굴 ' + (ratio ? Math.round(ratio * 100) + '%' : '—') + ' / ' + Math.round(NEAR * 100) + '%\n'
    + '제스처 ' + (g ? g.categoryName + ' ' + g.score.toFixed(2) : '—') + '\n'
    + (n === 0 ? '얼굴을 가까이' : n === 1 ? '엄지척을 올리세요' : '진행 중'));

  // 트리거 : 놓친 프레임 하나에 초기화되지 않게 깎기만 한다
  const wants = n === 0 ? ratio >= NEAR : n === 1 ? up : false;
  hits = wants ? hits + 1 : Math.max(0, hits - 1);
  if (wants && hits >= HITS) { hits = 0; window.__go(n + 1); }
};

if (new URLSearchParams(location.search).has('s')) say('');
else try {
  const { FilesetResolver, FaceDetector, GestureRecognizer } = await import(V + '/vision_bundle.mjs');
  const vision = await FilesetResolver.forVisionTasks(V + '/wasm');
  [fd, gr] = await Promise.all([
    FaceDetector.createFromOptions(vision, { runningMode: 'VIDEO',
      baseOptions: { modelAssetPath: M + '/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' } }),
    GestureRecognizer.createFromOptions(vision, { runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: .4, minHandPresenceConfidence: .4, minTrackingConfidence: .4,
      cannedGesturesClassifierOptions: { scoreThreshold: .2 },
      baseOptions: { modelAssetPath: M + '/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task' } }),
  ]);
  say('카메라 권한을 허용해 주세요');
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
  await video.play();
  say('카메라 ON');
  requestAnimationFrame(loop);
} catch (e) {
  say('카메라 없음 — 화면을 탭해 진행');
  console.warn('[cam]', e);
}
</script>
</body>
